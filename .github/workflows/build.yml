name: Build Lawnchair APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install gdown

      - name: Download Lawnchair source
        run: |
          gdown "https://drive.google.com/uc?id=1zLdhfTVVcj6FWmbYRo8QkEhgARWXIYPR" \
            -O lawnchair-source.zip

          echo "=== ZIP INFO ==="
          ls -lh lawnchair-source.zip
          file lawnchair-source.zip

      - name: Extract source
        run: |
          rm -rf source
          mkdir -p source
          unzip -q lawnchair-source.zip -d source

          echo "=== EXTRACTED FILES ==="
          find source -maxdepth 3 -type f | head -200

      - name: Locate Gradle project
        id: gradle-root
        shell: bash
        run: |
          PROJECT_ROOT="$(find source -type f -name gradlew -print -quit | xargs -r dirname | head -n 1)"

          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::No Gradle project found inside the downloaded ZIP."
            find source -maxdepth 5 -type f | head -200 || true
            exit 1
          fi

          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"
          echo "=== PROJECT ROOT ==="
          echo "$PROJECT_ROOT"

      - name: Install source into repo root
        shell: bash
        run: |
          PROJECT_ROOT="${{ steps.gradle-root.outputs.project_root }}"
          shopt -s dotglob nullglob
          rsync -a --delete "$PROJECT_ROOT"/. ./

          echo "=== PROJECT ROOT CONTENT ==="
          ls -la

          echo "=== GRADLE FILES ==="
          find . -maxdepth 3 \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "gradlew" \
            -o -path "./gradle/wrapper/*" \) \
            -print

      - name: Fix Gradle and Android plugin compatibility
        shell: bash
        run: |
          set -e

          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-bin.zip#' \
              gradle/wrapper/gradle-wrapper.properties
          fi

          for f in build.gradle build.gradle.kts settings.gradle settings.gradle.kts; do
            if [ -f "$f" ]; then
              echo "Patching $f"
              python3 - "$f" <<'PY'
         import re, sys
         from pathlib import Path
         p = Path(sys.argv[1])
         text = p.read_text()
         replacements = {
    "com.android.tools.build:gradle:3.6.4": "com.android.tools.build:gradle:8.2.2",
    "com.android.tools.build:gradle:4.2.2": "com.android.tools.build:gradle:8.2.2",
    "com.android.tools.build:gradle:7.0.4": "com.android.tools.build:gradle:8.2.2",
    "com.android.tools.build:gradle:7.4.2": "com.android.tools.build:gradle:8.2.2",
    "com.android.tools.build:gradle:8.1.0": "com.android.tools.build:gradle:8.2.2",
    "com.android.tools.build:gradle:8.2.0": "com.android.tools.build:gradle:8.2.2",
    "com.android.tools.build:gradle:8.2.1": "com.android.tools.build:gradle:8.2.2",
}
for old, new in replacements.items():
    text = text.replace(old, new)
p.write_text(text)
PY
            fi
          done

          echo "=== AGP VERSION CHECK ==="
          grep -RIn "com.android.tools.build:gradle\|distributionUrl" . || true

      - name: Prepare Gradle
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "::error::gradlew is missing in the project root."
            exit 1
          fi

          chmod +x ./gradlew

          echo "=== JAVA ==="
          java -version

          echo "=== GRADLE ==="
          ./gradlew --version

      - name: Build APK
        run: |
          set -e
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain \
            -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Find APK
        if: always()
        run: |
          echo "=== APK FILES ==="
          find . \
            -type f \
            -name "*.apk" \
            -not -path "./.git/*" \
            -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lawnchair-debug-apk
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
