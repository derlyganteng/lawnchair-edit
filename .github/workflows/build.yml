name: Build Lawnchair APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install gdown

      - name: Download source ZIP
        run: |
          gdown "https://drive.google.com/uc?id=1zLdhfTVVcj6FWmbYRo8QkEhgARWXIYPR" \
            -O lawnchair-source.zip

      - name: Extract source
        run: |
          rm -rf source
          mkdir source
          unzip -q lawnchair-source.zip -d source

          PROJECT_ROOT="$(find source -type f -name gradlew -print -quit | xargs dirname)"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Install source
        run: |
          shopt -s dotglob
          cp -a "$PROJECT_ROOT"/. ./

            - name: Restore SystemUI submodule
        run: |
          git submodule init
          git submodule update --init --recursive
      - name: Check required modules
        run: |
          echo "=== ICONLOADERLIB ==="
          ls -la platform_frameworks_libs_systemui/iconloaderlib

          echo "=== SEARCHUILIB ==="
          ls -la platform_frameworks_libs_systemui/searchuilib

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Prepare Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build APK
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain \
            -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Find APK
        if: always()
        run: |
          echo "=== APK FILES ==="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lawnchair-debug-apk
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
