name: Build Lawnchair APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download & Extract Zip
        run: |
          curl -L "https://files.catbox.moe/0anrcl.zip" -o lawnchair.zip
          unzip -o lawnchair.zip -d ./
          # Pindahkan isi jika terekstrak ke dalam folder turunan
          if [ -d "lawnchair-12.1.0-alpha.4" ]; then
            cp -rn lawnchair-12.1.0-alpha.4/* ./ || true
          fi
          chmod +x gradlew || true

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Result
        uses: actions/upload-artifact@v4
        with:
          name: Lawnchair-iOS18-APK
          path: "**/build/outputs/apk/debug/*.apk"
          
