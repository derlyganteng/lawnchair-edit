name: Build Lawnchair APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download & Extract Zip
        run: |
          curl -L "https://files.catbox.moe/jsxzni.zip" -o lawnchair.zip
          unzip -o -q lawnchair.zip

          if [ -d "lawnchair-12.1.0-alpha.4" ]; then
            cp -r lawnchair-12.1.0-alpha.4/. .
            rm -rf lawnchair-12.1.0-alpha.4 lawnchair.zip
          fi

          # Restore Lawnchair SystemUI submodule
          if [ ! -f "platform_frameworks_libs_systemui/iconloaderlib/build.gradle" ]; then
            rm -rf platform_frameworks_libs_systemui
            git clone https://github.com/LawnchairLauncher/platform_frameworks_libs_systemui.git platform_frameworks_libs_systemui
            git -C platform_frameworks_libs_systemui checkout e47476233aba2b05a8807ebf5b4c8fd0f89f24c3
          fi

          chmod +x gradlew

      - name: Build APK
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Result
        uses: actions/upload-artifact@v4
        with:
          name: Lawnchair-iOS18-APK
          path: "**/build/outputs/apk/debug/*.apk"
