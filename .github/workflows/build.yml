name: Build Lawnchair APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip python3-pip git
          python3 -m pip install --upgrade pip
          python3 -m pip install gdown

      - name: Download modified Lawnchair source
        run: |
          gdown "https://drive.google.com/uc?id=1zLdhfTVVcj6FWmbYRo8QkEhgARWXIYPR" \
            -O lawnchair-source.zip

          echo "=== ZIP INFO ==="
          ls -lh lawnchair-source.zip
          file lawnchair-source.zip

      - name: Extract source
        run: |
          rm -rf source
          mkdir -p source

          unzip -q lawnchair-source.zip -d source

          PROJECT_ROOT="$(find source -type f -name gradlew -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::gradlew tidak ditemukan."
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "=== PROJECT ROOT ==="
          echo "$PROJECT_ROOT"

      - name: Install modified source
        run: |
          shopt -s dotglob nullglob
          cp -a "$PROJECT_ROOT"/. ./

          echo "=== ROOT ==="
          ls -la

      - name: Restore exact SystemUI submodule
        run: |
          rm -rf platform_frameworks_libs_systemui

          git clone \
            https://github.com/LawnchairLauncher/platform_frameworks_libs_systemui.git \
            platform_frameworks_libs_systemui

          cd platform_frameworks_libs_systemui

          git checkout --detach \
            e47476233aba2b05a8807ebf5b4c8fd0f89f24c3

          cd ..

          echo "=== SYSTEMUI COMMIT ==="
          git -C platform_frameworks_libs_systemui rev-parse HEAD

      - name: Verify required modules
        run: |
          test -f platform_frameworks_libs_systemui/iconloaderlib/build.gradle
          test -f platform_frameworks_libs_systemui/searchuilib/build.gradle

          echo "iconloaderlib OK"
          echo "searchuilib OK"

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Prepare Gradle
        run: |
          chmod +x ./gradlew

          echo "=== JAVA ==="
          java -version

          echo "=== GRADLE ==="
          ./gradlew --version

      - name: Create dependency compatibility fix
        run: |
          cat > force-compatible-dependencies.gradle <<'EOF'
          allprojects {
              configurations.configureEach {
                  resolutionStrategy {
                      // Kotlin
                      force "org.jetbrains.kotlin:kotlin-stdlib:1.7.10"
                      force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.7.10"
                      force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.7.10"

                      // Kotlin coroutines compatible with Kotlin 1.7.x
                      force "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4"
                      force "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.6.4"
                      force "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4"

                      // AndroidX versions appropriate for this old project
                      force "androidx.annotation:annotation:1.5.0"
                      force "androidx.core:core:1.7.0"
                      force "androidx.core:core-ktx:1.7.0"
                      force "androidx.dynamicanimation:dynamicanimation:1.0.0"
                      force "androidx.recyclerview:recyclerview:1.2.1"
                      force "androidx.preference:preference:1.2.0"
                      force "androidx.preference:preference-ktx:1.2.0"
                      force "androidx.palette:palette:1.0.0"
                      force "androidx.palette:palette-ktx:1.0.0"

                      // Lifecycle
                      force "androidx.lifecycle:lifecycle-common:2.5.1"
                      force "androidx.lifecycle:lifecycle-common-java8:2.5.1"
                      force "androidx.lifecycle:lifecycle-runtime:2.5.1"
                      force "androidx.lifecycle:lifecycle-runtime-ktx:2.5.1"
                      force "androidx.lifecycle:lifecycle-viewmodel:2.5.1"
                      force "androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1"
                  }
              }
          }
          EOF

          echo "=== COMPATIBILITY FIX ==="
          cat force-compatible-dependencies.gradle

      - name: Build Lawnchair
        run: |
          ./gradlew assembleLawnWithQuickstepDebug \
            --init-script force-compatible-dependencies.gradle \
            --no-daemon \
            --refresh-dependencies \
            --stacktrace \
            --console=plain \
            -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Find APK
        if: always()
        run: |
          echo "=== APK FILES ==="

          find . \
            -type f \
            -name "*.apk" \
            -not -path "./.git/*" \
            -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lawnchair-debug-apk
          path: |
            build/outputs/apk/lawnWithQuickstep/debug/*.apk
          if-no-files-found: error
