name: Build Lawnchair APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 11 — TANPA cache gradle
      # Karena source Lawnchair baru masuk setelah ZIP diekstrak
      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # 3. Download source ZIP dari Google Drive
      - name: Install gdown
        run: |
          python3 -m pip install --upgrade pip
          pip install gdown

      - name: Download Lawnchair source
        run: |
          gdown "https://drive.google.com/uc?id=1zLdhfTVVcj6FWmbYRo8QkEhgARWXIYPR" \
            -O lawnchair-source.zip

          echo "=== ZIP INFO ==="
          ls -lh lawnchair-source.zip

      # 4. Extract source
      - name: Extract source
        run: |
          mkdir source
          unzip -q lawnchair-source.zip -d source

          echo "=== EXTRACTED SOURCE ==="
          ls -la source

      # 5. Pindahkan isi source ke root repository
      - name: Install source
        shell: bash
        run: |
          shopt -s dotglob nullglob

          items=(source/*)

          if [ ${#items[@]} -eq 1 ] && [ -d "${items[0]}" ]; then
            echo "Single root folder detected:"
            echo "${items[0]}"

            cp -a "${items[0]}"/. .
          else
            echo "Source files are directly inside ZIP."
            cp -a source/. .
          fi

          rm -rf source lawnchair-source.zip

          echo "=== PROJECT ROOT ==="
          ls -la

      # 6. Pastikan Gradle wrapper executable
      - name: Prepare Gradle
        run: |
          chmod +x gradlew

          echo "=== GRADLE VERSION ==="
          ./gradlew --version

      # 7. Build APK
      - name: Build Lawnchair APK
        run: |
          ./gradlew assembleLawnWithQuickstepDebug \
            --no-daemon \
            --stacktrace \
            --info

      # 8. Cari semua APK
      - name: Find APK
        if: always()
        run: |
          echo "=== APK FILES ==="
          find . -type f -name "*.apk" -print

      # 9. Upload APK sebagai Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lawnchair-debug-apk
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
