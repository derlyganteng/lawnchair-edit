name: Build Lawnchair APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install gdown

      - name: Download Lawnchair source
        run: |
          gdown "https://drive.google.com/uc?id=1zLdhfTVVcj6FWmbYRo8QkEhgARWXIYPR" \
            -O lawnchair-source.zip

          echo "=== ZIP INFO ==="
          ls -lh lawnchair-source.zip
          file lawnchair-source.zip

      - name: Extract source
        run: |
          rm -rf source
          mkdir -p source

          unzip -q lawnchair-source.zip -d source

          echo "=== FIND GRADLE PROJECT ==="
          find source -type f -name "gradlew" -print

      - name: Locate Gradle project
        id: gradle-root
        shell: bash
        run: |
          PROJECT_ROOT="$(find source -type f -name gradlew -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::No Gradle project found inside ZIP."
            find source -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

          echo "=== PROJECT ROOT ==="
          echo "$PROJECT_ROOT"

      - name: Install source into repository
        shell: bash
        run: |
          PROJECT_ROOT="${{ steps.gradle-root.outputs.project_root }}"

          shopt -s dotglob nullglob
          cp -a "$PROJECT_ROOT"/. ./

          echo "=== ROOT FILES ==="
          ls -la

          echo "=== GRADLE FILES ==="
          find . -maxdepth 3 \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "gradlew" \
            -o -path "./gradle/wrapper/*" \) \
            -print

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Gradle
        run: |
          chmod +x ./gradlew

          echo "=== JAVA ==="
          java -version

          echo "=== GRADLE ==="
          ./gradlew --version

      - name: Build APK
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain \
            -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Find APK
        if: always()
        run: |
          echo "=== APK FILES ==="

          find . \
            -type f \
            -name "*.apk" \
            -not -path "./.git/*" \
            -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lawnchair-debug-apk
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Check Lawnchair modules
        run: |
          echo "=== ICONLOADERLIB ==="
          ls -la iconloaderlib || true
          find iconloaderlib -maxdepth 2 -type f -print || true

          echo "=== SEARCHUILIB ==="
          ls -la searchuilib || true
          find searchuilib -maxdepth 2 -type f -print || true

          echo "=== SETTINGS ==="
          grep -n "iconloaderlib\|searchuilib" settings.gradle settings.gradle.kts 2>/dev/null || true

          echo "=== MODULE BUILD FILES ==="
          find iconloaderlib searchuilib \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print 2>/dev/null || true
