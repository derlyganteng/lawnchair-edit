name: Build Lawnchair APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip python3-pip rsync
          python3 -m pip install --upgrade pip
          python3 -m pip install gdown

      - name: Download Lawnchair source
        run: |
          gdown "https://drive.google.com/uc?id=1zLdhfTVVcj6FWmbYRo8QkEhgARWXIYPR" \
            -O lawnchair-source.zip

          echo "=== ZIP INFO ==="
          ls -lh lawnchair-source.zip
          file lawnchair-source.zip

      - name: Extract source
        run: |
          rm -rf source
          mkdir -p source

          unzip -q lawnchair-source.zip -d source

          echo "=== FIND GRADLE PROJECT ==="
          find source -type f -name "gradlew" -print

      - name: Locate Gradle project
        id: gradle-root
        shell: bash
        run: |
          PROJECT_ROOT="$(find source -type f -name gradlew -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::No Gradle project found inside ZIP."
            find source -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

          echo "=== PROJECT ROOT ==="
          echo "$PROJECT_ROOT"

      - name: Install source into repository
        shell: bash
        run: |
          PROJECT_ROOT="${{ steps
