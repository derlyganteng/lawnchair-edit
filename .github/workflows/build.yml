name: Build Lawnchair APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download & Extract Zip
        run: |
          curl -L "https://files.catbox.moe/jsxzni.zip" -o lawnchair.zip
          unzip -q lawnchair.zip
          if [ -d "lawnchair-12.1.0-alpha.4" ]; then
            cp -r lawnchair-12.1.0-alpha.4/. .
            rm -rf lawnchair-12.1.0-alpha.4 lawnchair.zip
          fi
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Upload APK Result
        uses: actions/upload-artifact@v4
        with:
          name: Lawnchair-iOS18-APK
          path: "**/build/outputs/apk/debug/*.apk"
          
